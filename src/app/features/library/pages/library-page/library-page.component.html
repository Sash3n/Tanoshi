<div class="min-h-screen bg-[var(--tanoshi-bg-base)] flex flex-col">
  <!-- Header -->
  <header class="px-4 pt-12 pb-4 flex items-end justify-between">
    <h1 class="text-[var(--tanoshi-text-primary)] text-2xl font-serif tracking-wide">
      たのし
    </h1>
    <span class="text-[var(--tanoshi-text-tertiary)] text-xs font-mono">
      {{ store.seriesCount() }} series
    </span>
  </header>

  <!-- Error banner -->
  @if (store.errorMessage()) {
    <div class="mx-4 mb-3 px-3 py-2 rounded-md bg-red-900/30 border border-red-800/50">
      <p class="text-red-300 text-xs">{{ store.errorMessage() }}</p>
    </div>
  }

  <!-- Import progress -->
  @if (store.importProgress()) {
    <div class="mx-4 mb-3 px-3 py-2 rounded-md bg-[var(--tanoshi-bg-elevated)] border border-[var(--tanoshi-border-subtle)]">
      <p class="text-[var(--tanoshi-accent-teal)] text-xs font-mono">
        {{ store.importProgress()!.currentStep }}
      </p>
    </div>
  }

  <!-- Content -->
  <main class="flex-1">
    @if (store.isLoading() && store.seriesList().length === 0) {
      <div class="flex items-center justify-center py-24">
        <div class="w-6 h-6 border-2 border-[var(--tanoshi-accent-gold)] border-t-transparent rounded-full animate-spin"></div>
      </div>
    } @else if (store.isEmpty()) {
      <app-empty-state />
    } @else {
      <app-library-grid [seriesList]="store.seriesList()" />
    }
  </main>

  <!-- Import FAB -->
  <app-import-fab (fileSelected)="onFileSelected($event)" />
</div>
