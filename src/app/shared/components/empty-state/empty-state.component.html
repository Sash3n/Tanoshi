<div class="flex flex-col items-center justify-center h-full gap-6 px-8 text-center py-24">
  <lucide-icon
    [img]="bookOpenIcon"
    size="64"
    color="var(--tanoshi-text-tertiary)"
    class="opacity-40"
  />
  <div class="flex flex-col gap-2">
    <h2 class="text-[var(--tanoshi-text-primary)] text-xl font-serif">{{ title() }}</h2>
    <p class="text-[var(--tanoshi-text-secondary)] text-sm leading-relaxed">{{ description() }}</p>
  </div>
</div>
